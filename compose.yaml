name: cloudvault

services:
  postgres:
    profiles: ["pgvector-lab"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cloudvault
      POSTGRES_USER: cloudvault
      POSTGRES_PASSWORD: cloudvault-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudvault -d cloudvault"]
      interval: 10s
      timeout: 5s
      retries: 5

  s3mock:
    profiles: ["s3mock"]
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: cloudvault-staging,cloudvault-clean
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - s3mock-data:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  dex:
    image: ghcr.io/dexidp/dex:v2.45.1-alpine@sha256:8499afd690c437f52301efd2b05b2455da5bd2dfc20332cd697dc9937f808462
    profiles: ["identity"]
    cpus: 0.5
    mem_limit: 256m
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "127.0.0.1:5556:5556"
    volumes:
      - ./infra/dex/config.yaml:/etc/dex/config.yaml:ro
      - dex-data:/var/dex

  clamav:
    image: clamav/clamav:stable
    profiles: ["scanner"]
    cpus: 1.5
    mem_limit: 2g
    pids_limit: 128
    ports:
      - "127.0.0.1:3310:3310"
    # First start downloads malware signatures; scan processing stays local.

volumes:
  postgres-data:
  s3mock-data:
  redis-data:
  dex-data:
